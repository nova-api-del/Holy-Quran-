name: Quran Auto Publisher
on:
  push:
    paths:
      - requirements.txt
  workflow_dispatch:
  schedule:
    # 12:00 and 20:00 Iraq time (UTC+3)
    - cron: "0 9,17 * * *"
permissions:
  contents: write
concurrency:
  group: quran-auto-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Deno for YouTube JavaScript challenge solving
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install Python requirements
        run: pip install -r requirements.txt
      - name: Diagnose YouTube OAuth credentials
        id: oauth_diagnostics
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python app/diagnostics.py
      - name: Build and publish
        id: build_publish
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python app/main.py
      - name: Record workflow result in diagnostics
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build_publish.outcome }}
          OAUTH_OUTCOME: ${{ steps.oauth_diagnostics.outcome }}
        run: |
          mkdir -p work
          if [ ! -f work/diagnostics.md ]; then
            printf '# Latest workflow diagnostics\n\nOAuth diagnostic script did not produce a report. Check earlier workflow steps.\n' > work/diagnostics.md
          fi
          printf '\n## Workflow result\n\n- OAuth diagnostic step: %s\n- Build and publish step: %s\n' "$OAUTH_OUTCOME" "$BUILD_OUTCOME" >> work/diagnostics.md
          if [ -f work/diagnostics.json ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("work/diagnostics.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["workflow"] = {"oauth_diagnostics_step": os.environ.get("OAUTH_OUTCOME"),
                              "build_and_publish_step": os.environ.get("BUILD_OUTCOME")}
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          fi
      - name: Save ledger and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never persist browser/session cookies or other credential material.
          rm -f work/youtube_cookies.txt
          printf '\\n# Runtime secrets and session material\\nwork/youtube_cookies.txt\\n*.cookies.txt\\n' >> .gitignore
          git add .gitignore
          git add -A work/ 2>/dev/null || true
          git commit -m "chore: save workflow diagnostics and publication ledger" || true
          git push || true
